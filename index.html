<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- ARTIFACT-START -->
<title>Blast Off Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap">
<style>
  :root{
    --navy:#16225e; --blue:#2447b8; --red:#ff3b2f; --yellow:#ffd23f; --ink:#141a3d; --green:#3ccf6a;
    --gap:8px;
    --tile:min(84px, calc((100vw - 24px - 40px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)) / 6));
    color-scheme: light;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--navy);
    font-family:'Luckiest Guy','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
    touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  #stage{position:relative;flex:1 1 auto;min-height:0;min-width:0;overflow:hidden;background:#a9dcff}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

  /* ---------- blueprint tray ---------- */
  #tray{flex:none;position:relative;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;
    padding:18px calc(12px + env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) calc(12px + env(safe-area-inset-left,0px));
    background-color:var(--blue);
    background-image:linear-gradient(rgba(255,255,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.09) 1px,transparent 1px);
    background-size:18px 18px}
  #tray::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;
    background:repeating-linear-gradient(-45deg,var(--yellow) 0 12px,var(--ink) 12px 24px)}
  #tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--gap);width:calc(6 * var(--tile) + 5 * var(--gap))}
  .tab{height:calc(var(--tile) * .66);border-radius:14px;border:2.5px solid rgba(255,255,255,.35);background:rgba(10,20,70,.35);
    display:grid;place-items:center;padding:0;cursor:pointer;touch-action:manipulation}
  .tab img{height:82%;width:82%;object-fit:contain;pointer-events:none}
  .tab.on{background:var(--yellow);border-color:#fff;box-shadow:0 4px 0 #c79400}
  .tab:focus-visible{outline:4px solid #fff;outline-offset:2px}
  .tab.nudge{animation:nudge .55s ease 5;border-color:var(--yellow);box-shadow:0 0 0 5px rgba(255,210,63,.7)}
  .row{display:flex;justify-content:center;gap:var(--gap);width:calc(6 * var(--tile) + 5 * var(--gap));height:var(--tile)}
  @media (min-aspect-ratio: 5/4){
    :root{--tile:min(84px, calc((100dvh - 24px - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) / 6))}
    #app{flex-direction:row}
    #tray{flex-direction:row;padding:calc(12px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) 19px}
    #tray::before{right:auto;bottom:0;width:7px;height:auto}
    #tabs{grid-template-columns:none;grid-template-rows:repeat(6,1fr);width:auto;height:calc(6 * var(--tile) + 5 * var(--gap))}
    .tab{height:auto;width:calc(var(--tile) * .72)}
    .row{flex-direction:column;width:var(--tile);height:calc(6 * var(--tile) + 5 * var(--gap))}
  }
  .tile{width:var(--tile);height:var(--tile);border-radius:22%;position:relative;display:grid;place-items:center;
    touch-action:none;cursor:grab;background:rgba(255,255,255,.14);border:2.5px solid rgba(255,255,255,.6);
    box-shadow:0 4px 0 rgba(0,0,0,.2);transition:background .2s,border-color .2s}
  .tile img{width:92%;height:92%;object-fit:contain;pointer-events:none;-webkit-user-drag:none;transition:opacity .2s}
  .tile:focus-visible{outline:4px solid var(--yellow);outline-offset:2px}
  .row.stickers .tile{background:#fbfcff;border:2.5px dashed #b7c4ee}
  .row.stickers .tile img{width:80%;height:80%}
  @keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-13deg)}40%{transform:rotate(11deg)}60%{transform:rotate(-7deg)}80%{transform:rotate(4deg)}}
  .wiggle{animation:wiggle .45s ease}
  @keyframes nudge{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-12px) scale(1.1)}}
  .tile.nudge{animation:nudge .55s ease 5;border-color:var(--yellow);box-shadow:0 0 0 5px rgba(255,210,63,.6)}
  @keyframes arrive{0%{transform:scale(.3)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
  .tile.arrive{animation:arrive .4s ease}

  /* ---------- HUD ---------- */
  .hud{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:10px;z-index:5}
  .hud.left{left:calc(12px + env(safe-area-inset-left,0px))}
  .hud.right{right:12px}
  .rbtn{width:54px;height:54px;border-radius:50%;border:none;background:#fff;color:var(--blue);display:grid;place-items:center;
    box-shadow:0 4px 0 rgba(20,26,61,.28);padding:0;cursor:pointer}
  .rbtn svg{width:30px;height:30px}
  .rbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(20,26,61,.28)}
  .rbtn:focus-visible,.bigbtn:focus-visible,#launch:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}
  .stars{height:54px;padding:0 18px 0 10px;border-radius:27px;background:#fff;display:flex;align-items:center;gap:6px;
    color:var(--ink);font-size:30px;line-height:1;box-shadow:0 4px 0 rgba(20,26,61,.28);font-variant-numeric:tabular-nums}
  .stars svg{width:36px;height:36px}
  .stars .n{padding-top:5px}
  @keyframes starpop{0%{transform:scale(1)}40%{transform:scale(1.5) rotate(-10deg)}100%{transform:scale(1)}}
  .stars.pop svg{animation:starpop .6s ease 2}

  /* ---------- launch button ---------- */
  #launch{position:absolute;right:14px;bottom:14px;width:100px;height:100px;border-radius:50%;border:none;padding:8px;cursor:pointer;z-index:5;
    background:repeating-conic-gradient(var(--yellow) 0 15deg,var(--ink) 15deg 30deg);box-shadow:0 7px 0 rgba(20,26,61,.4)}
  #launch .cap{width:100%;height:100%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 38% 30%,#ff9d8e 0,#ff3b2f 46%,#c3160c 100%);box-shadow:inset 0 -7px 0 rgba(0,0,0,.2);
    color:#fff;font-size:22px;letter-spacing:1px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
  #launch svg{width:44px;height:44px;margin-bottom:-4px}
  #launch .go{padding-top:3px}
  #launch:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(20,26,61,.4)}
  @keyframes ready{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
  #launch.ready{animation:ready 1s ease-in-out infinite}
  body:not([data-state="build"]) #launch, body:not([data-state="build"]) .only-build{display:none}
  body:not([data-state="build"]) #tray{pointer-events:none}
  #tray .row,#tabs{transition:opacity .3s}
  body:not([data-state="build"]) #tray .row,body:not([data-state="build"]) #tabs{opacity:.4}

  /* ---------- overlays ---------- */
  #count{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:6}
  #count span{font-size:min(36vw,190px);line-height:1;color:var(--yellow);-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;
    text-shadow:0 9px 0 var(--ink);animation:countpop .95s ease forwards}
  @keyframes countpop{0%{transform:scale(.2);opacity:0}25%{transform:scale(1.15);opacity:1}45%{transform:scale(1)}80%{opacity:1}100%{transform:scale(1.35);opacity:0}}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}
  #confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:6}
  .cf{position:absolute;top:-24px;border-radius:3px;animation:fall linear forwards}
  @keyframes fall{to{transform:translate(var(--dx),115vh) rotate(var(--rot))}}
  #result{position:absolute;inset:0;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:16px;
    padding-top:calc(76px + env(safe-area-inset-top,0px));pointer-events:none}
  #result .title{font-size:min(16vw,92px);line-height:1;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;
    text-shadow:0 7px 0 var(--ink);letter-spacing:2px;animation:titlepop .6s cubic-bezier(.2,1.7,.4,1) both}
  #result.win .title{color:var(--yellow)}
  #result .bigstar{width:min(34vw,150px);height:min(34vw,150px);animation:spin 5s linear infinite, titlepop .6s cubic-bezier(.2,1.7,.4,1) both;
    filter:drop-shadow(0 0 18px rgba(255,220,90,.9))}
  #result.lose .bigstar{display:none}
  @keyframes titlepop{0%{transform:scale(0)}100%{transform:scale(1)}}
  @keyframes spin{to{rotate:360deg}}
  .btns{display:flex;gap:18px;pointer-events:auto}
  .bigbtn{width:96px;height:96px;border-radius:50%;border:none;display:grid;place-items:center;cursor:pointer;padding:0;
    background:var(--green);color:#fff;box-shadow:0 7px 0 #1f8a43,0 12px 22px rgba(0,0,0,.2);
    animation:titlepop .5s .25s cubic-bezier(.2,1.7,.4,1) both}
  .bigbtn svg{width:52px;height:52px}
  .bigbtn.alt{background:#fff;color:var(--blue);box-shadow:0 7px 0 #b8c3e6,0 12px 22px rgba(0,0,0,.2)}
  .bigbtn.no{background:#fff;color:var(--red);box-shadow:0 7px 0 #c9d2ee,0 12px 22px rgba(0,0,0,.2)}
  .bigbtn:active{transform:translateY(5px)}
  #confirm{position:absolute;inset:0;z-index:8;background:rgba(22,34,94,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
  #confirm .q{width:110px;height:110px;border-radius:50%;background:var(--yellow);color:var(--ink);display:grid;place-items:center;box-shadow:0 7px 0 #d19f00}
  #confirm .q svg{width:66px;height:66px}
  #dragGhost{position:fixed;left:0;top:0;width:88px;height:88px;pointer-events:none;z-index:30;transform:translate(-50%,-50%);
    filter:drop-shadow(0 8px 5px rgba(0,0,0,.3))}
  #hand{position:fixed;left:0;top:0;width:64px;height:64px;pointer-events:none;z-index:25;opacity:0;transform-origin:30px 6px;
    filter:drop-shadow(0 5px 4px rgba(0,0,0,.35))}
  @media (prefers-reduced-motion: reduce){
    #launch.ready,#result .bigstar{animation:none}
  }
</style>
</head>
<body data-state="build">
<div id="app">
  <div id="stage">
    <canvas id="c" aria-label="Rocket building area"></canvas>

    <div class="hud left">
      <button class="rbtn" id="btnSound" aria-label="Sound on or off">
        <svg id="icoOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg id="icoOff" hidden viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9.5l5 5M22 9.5l-5 5"/></svg>
      </button>
      <button class="rbtn only-build" id="btnReset" aria-label="Start a new rocket">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 2l2.2 6.3L19.5 10l-6.3 2.2L11 18.5l-2.2-6.3L2.5 10l6.3-1.7z"/><path d="M19 14l.9 2.1L22 17l-2.1.9L19 20l-.9-2.1L16 17l2.1-.9z"/></svg>
      </button>
    </div>
    <div class="hud right">
      <div class="stars" id="stars" aria-label="Rockets launched">
        <svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2 6.1 20.4l1.3-6.5L2.5 9.3l6.6-.8z" fill="#ffd23f" stroke="#e39a00" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span class="n" id="starsN">0</span>
      </div>
    </div>

    <button id="launch" aria-label="Launch the rocket">
      <span class="cap">
        <svg viewBox="0 0 64 64"><path d="M32 4c10 8 14 20 14 32l-3 9H21l-3-9C18 24 22 12 32 4z" fill="#fff"/><circle cx="32" cy="25" r="6" fill="#ff3b2f"/><path d="M19 34l-8 11 10 1zM45 34l8 11-10 1z" fill="#fff"/><path d="M25 49h14l-7 12z" fill="#ffd23f"/></svg>
        <span class="go">GO!</span>
      </span>
    </button>

    <div id="count"></div>
    <div id="confetti"></div>

    <div id="result" hidden>
      <svg class="bigstar" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2 6.1 20.4l1.3-6.5L2.5 9.3l6.6-.8z" fill="#ffd23f" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></svg>
      <div class="title" id="resTitle">HOORAY!</div>
      <div class="btns">
        <button class="bigbtn" id="btnAgain" aria-label="Fly again">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 3v5h-5"/></svg>
        </button>
        <button class="bigbtn alt" id="btnNew2" aria-label="Build a new rocket">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 2l2.2 6.3L19.5 10l-6.3 2.2L11 18.5l-2.2-6.3L2.5 10l6.3-1.7z"/><path d="M19 14l.9 2.1L22 17l-2.1.9L19 20l-.9-2.1L16 17l2.1-.9z"/></svg>
        </button>
        <button class="bigbtn" id="btnFix" aria-label="Fix the rocket">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        </button>
      </div>
    </div>

    <div id="confirm" hidden>
      <div class="q"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 2l2.2 6.3L19.5 10l-6.3 2.2L11 18.5l-2.2-6.3L2.5 10l6.3-1.7z"/><path d="M19 14l.9 2.1L22 17l-2.1.9L19 20l-.9-2.1L16 17l2.1-.9z"/></svg></div>
      <div class="btns">
        <button class="bigbtn" id="btnYes" aria-label="Yes, start a new rocket"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
        <button class="bigbtn no" id="btnNo" aria-label="No, keep this rocket"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
    </div>

    <div id="flash"></div>
  </div>

  <div id="tray">
    <div id="tabs" role="tablist" aria-label="Part boxes"></div>
    <div id="items"></div>
  </div>
</div>

<img id="dragGhost" alt="" hidden>
<div id="hand"><svg viewBox="0 0 64 64"><path d="M25 7a5 5 0 0 1 10 0v21l3-.6a5 5 0 0 1 5.6 3.2l.4.9a5 5 0 0 1 6.6 3.4l.3.9a5 5 0 0 1 6.1 4.9V48c0 8.8-7.2 14-16 14h-5c-6.2 0-10.6-2.8-14-8L11 43.5a5 5 0 0 1 7.6-6.4L25 43z" fill="#fff" stroke="#16225e" stroke-width="3" stroke-linejoin="round"/></svg></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* ============================================================
   Small helpers
   ============================================================ */
const $ = (s) => document.querySelector(s);
const stage = $('#stage'), canvas = $('#c');

const launchBtn = $('#launch'), ghostImg = $('#dragGhost'), hand = $('#hand');
const countEl = $('#count'), flashEl = $('#flash'), resultEl = $('#result'), confettiEl = $('#confetti');

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const X = V(1, 0, 0), Y = V(0, 1, 0), Z = V(0, 0, 1);
const tmpQ = new THREE.Quaternion();
const COARSE = matchMedia('(pointer: coarse)').matches;
const LIFT = COARSE ? 58 : 0;          // dragged things float above the finger so it doesn't hide them
const store = {
  get(k, d) { try { const v = localStorage.getItem('blastoff.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('blastoff.' + k, JSON.stringify(v)); } catch {} },
};
function restartAnim(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

/* ============================================================
   Sound (all synthesized, no files)
   ============================================================ */
const sfx = (() => {
  let ac = null, out = null, noiseBuf = null, rumble = null, muted = store.get('muted', false);
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC(); out = ac.createGain(); out.gain.value = muted ? 0 : 0.7; out.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(f0, f1, dur, type = 'sine', vol = 0.3, delay = 0) {
    if (!ac) return; const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain(); o.type = type;
    o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = o;
    if (type === 'sawtooth' || type === 'square') { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 2000; o.connect(f); node = f; }
    node.connect(g).connect(out); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, vol, f0, f1, ftype = 'lowpass', delay = 0, q = 1) {
    if (!ac) return; const t = ac.currentTime + delay;
    const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = ac.createBiquadFilter(); f.type = ftype; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(out); s.start(t, Math.random()); s.stop(t + dur + 0.05);
  }
  return {
    init,
    get muted() { return muted; },
    toggle() { muted = !muted; store.set('muted', muted); if (out) out.gain.value = muted ? 0 : 0.7; if (muted) try { speechSynthesis.cancel(); } catch {} return muted; },
    pop() { tone(480, 920, 0.12, 'sine', 0.35); tone(1400, 1500, 0.06, 'triangle', 0.08, 0.03); },
    pick() { tone(380, 560, 0.08, 'triangle', 0.18); },
    turn() { tone(600, 980, 0.1, 'triangle', 0.22); noise(0.05, 0.12, 5000, 2500, 'highpass'); },
    poof() { noise(0.3, 0.35, 1800, 300, 'bandpass', 0, 0.8); },
    nope() { tone(260, 180, 0.16, 'square', 0.1); tone(200, 140, 0.2, 'square', 0.1, 0.13); },
    boop() { tone(880, 620, 0.09, 'sine', 0.2); },
    beep() { tone(660, 660, 0.2, 'square', 0.12); },
    go() { tone(990, 990, 0.55, 'square', 0.12); tone(1320, 1320, 0.55, 'sine', 0.1); },
    whoosh() { noise(1.6, 0.5, 250, 3200, 'bandpass', 0, 0.7); },
    sputter() { noise(0.12, 0.45, 900, 200, 'lowpass'); tone(120, 60, 0.12, 'sawtooth', 0.12); },
    boom() { noise(2.4, 1.0, 2200, 50, 'lowpass'); tone(110, 26, 1.3, 'sine', 0.9); noise(0.5, 0.6, 6000, 700, 'lowpass'); },
    fanfare() {
      [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.22, 'triangle', 0.28, i * 0.14));
      [523, 659, 784].forEach((f) => tone(f, f, 1.0, 'triangle', 0.18, 0.64)); tone(1047, 1047, 1.0, 'square', 0.07, 0.64);
      for (let i = 0; i < 8; i++) tone(1800 + i * 150, 2400 + i * 150, 0.08, 'sine', 0.06, 1.1 + i * 0.07);
    },
    wahwah() { [392, 370, 349].forEach((f, i) => tone(f, f * 0.98, 0.38, 'sawtooth', 0.11, i * 0.42)); tone(330, 240, 1.1, 'sawtooth', 0.11, 1.26); },
    say(text) {             // spoken countdown via the browser's built-in voice
      const ss = window.speechSynthesis; if (!ss || muted) return;
      try {
